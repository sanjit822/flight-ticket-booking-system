<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment - FlyHigh Airlines</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f0f8ff;
    }
    header {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 20px;
    }
    nav {
      background-color: #0055aa;
      text-align: center;
      padding: 10px;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .payment-container {
      background: white;
      margin: 30px auto;
      padding: 25px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
      border-radius: 12px;
    }
    .payment-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #003366;
    }
    .payment-container input, 
    .payment-container select, 
    .payment-container button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    .payment-container button {
      background-color: #28a745;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .payment-container button:hover {
      background-color: #218838;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 30px;
    }
    .gallery img {
      width: 22%;
      margin: 10px;
      border-radius: 10px;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      padding-top: 100px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.6);
    }
    .modal-content {
      background: white;
      margin: auto;
      padding: 20px;
      width: 80%;
      max-width: 400px;
      border-radius: 10px;
      text-align: center;
      animation: slideDown 0.5s ease;
    }
    @keyframes slideDown {
      from { transform: translateY(-100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .close {
      color: red;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #003366;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
  </style>
</head>
<body>

<header>
  <h1>FlyHigh Airlines - Payment</h1>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('search_flights') }}">Search Flights</a>  <!-- Fixed here -->
    <a href="{{ url_for('booking') }}">Book Now</a>
    <a href="{{ url_for('contact') }}">Contact Us</a>
    <a href="{{ url_for('payment') }}">Payment</a>
</nav>
</header>



<section class="payment-container">
  <h2>Complete Your Payment</h2>
  <form id="paymentForm">
    <select id="paymentMethod" required>
      <option value="">Select Payment Method</option>
      <option value="credit">Credit Card</option>
      <option value="debit">Debit Card</option>
      <option value="upi">UPI</option>
      <option value="netbanking">Net Banking</option>
    </select>
    <input type="text" id="cardName" placeholder="Name on Card" required>
    <input type="text" id="cardNumber" placeholder="Card Number (16 digits)" pattern="\d{16}" required>
    <input type="text" id="expiry" placeholder="Expiry Date (MM/YY)" required>
    <input type="text" id="cvv" placeholder="CVV (3 digits)" pattern="\d{3}" required>
    <label><input type="checkbox" id="saveCard"> Save this card for future payments</label>
    <button type="submit">Pay Now</button>
    <div class="loader" id="loader"></div>
  </form>
</section>

<section class="gallery">
  <img src="{{ url_for('static', filename='images/money1.png') }}" alt="Gallery 1">
  <img src="{{ url_for('static', filename='images/money2.png') }}" alt="Gallery 1">
  <img src="{{ url_for('static', filename='images/money3.png') }}" alt="Gallery 1">
  <img src="{{ url_for('static', filename='images/money4.png') }}" alt="Gallery 1">
  <img src="{{ url_for('static', filename='images/money5.png') }}" alt="Gallery 1">
  <img src="{{ url_for('static', filename='images/money6.png') }}" alt="Gallery 1">
  <img src="{{ url_for('static', filename='images/money7.png') }}" alt="Gallery 1">
  <img src="{{ url_for('static', filename='images/money8.png') }}" alt="Gallery 1">
</section>

<footer>
  <p>© 2025 FlyHigh Airlines. All rights reserved.</p>
</footer>

<!-- Modal -->
<div id="paymentModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>✔️ Payment Successful!</h2>
    <p>Thank you for your payment. Have a great flight!</p>
    <button onclick="goHome()">Go to Home</button>
  </div>
</div>

<script>
  const paymentForm = document.getElementById('paymentForm');
  const paymentModal = document.getElementById('paymentModal');
  const closeBtn = document.querySelector('.close');
  const loader = document.getElementById('loader');

  paymentForm.addEventListener('submit', function(event) {
    event.preventDefault();

    const cardName = document.getElementById('cardName').value.trim();
    const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
    const expiry = document.getElementById('expiry').value.trim();
    const cvv = document.getElementById('cvv').value.trim();
    const paymentMethod = document.getElementById('paymentMethod').value;

    if (!paymentMethod) {
      alert('Please select a payment method.');
      return;
    }
    if (cardName.length < 3) {
      alert('Name on card must be at least 3 characters.');
      return;
    }
    if (!/^\d{16}$/.test(cardNumber)) {
      alert('Card number must be 16 digits.');
      return;
    }
    if (!/^\d{2}\/\d{2}$/.test(expiry)) {
      alert('Expiry must be in MM/YY format.');
      return;
    }
    if (!/^\d{3}$/.test(cvv)) {
      alert('CVV must be 3 digits.');
      return;
    }

    loader.style.display = 'block'; // Show spinner

    setTimeout(() => {
      loader.style.display = 'none';
      paymentModal.style.display = 'block';
      paymentForm.reset(); // Clear form after success
    }, 2000);
  });

  closeBtn.onclick = function() {
    paymentModal.style.display = 'none';
  }

  window.onclick = function(event) {
    if (event.target == paymentModal) {
      paymentModal.style.display = 'none';
    }
  }

  function goHome() {
    window.location.href = '{{ url_for("home") }}';
  }

  // Input Masking
  document.getElementById('cardNumber').addEventListener('input', function (e) {
    e.target.value = e.target.value.replace(/\D/g, '').replace(/(.{4})/g, '$1 ').trim();
  });

  document.getElementById('expiry').addEventListener('input', function (e) {
    let val = e.target.value.replace(/\D/g, '');
    if (val.length >= 3) {
      val = val.slice(0, 2) + '/' + val.slice(2);
    }
    e.target.value = val;
  });
</script>

</body>
</html>
