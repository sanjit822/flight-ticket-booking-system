<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Booking - Home</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f8ff;
        }
        header {
            background-color: #00539C;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background: #0077cc;
            padding: 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 0 10px;
            font-weight: bold;
        }
        .hero {
            position: relative;
            text-align: center;
            margin: 20px;
        }
        .hero img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
        }
        .hero h1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 3rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
        }
        .search-form {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .search-form input, .search-form button {
            padding: 12px;
            margin: 0 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .search-form button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        .search-form button:hover {
            background-color: #218838;
        }
        .gallery {
            display: flex;
            justify-content: space-around;
            margin: 20px;
            flex-wrap: wrap;
        }
        .gallery img {
            width: 23%;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
        .gallery img:active {
            transform: scale(1.1);
        }
        footer {
            background: #00539C;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
        footer a {
            margin: 0 10px;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
        }
        footer a:hover {
            color: #ffcc00;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>FlyHigh Airlines</h1>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('search_flights') }}">Search Flights</a>  <!-- Fixed here -->
        <a href="{{ url_for('booking') }}">Book Now</a>
        <a href="{{ url_for('contact') }}">Contact Us</a>
        <a href="{{ url_for('payment') }}">Payment</a>
    </nav>
</header>



<section class="hero">
    <img src="{{ url_for('static', filename='images/image1.png') }}" alt="Gallery 1">
    <h1>Book Your Dream Journey</h1>
</section>

<section class="search-form" id="search">
    <input type="text" placeholder="From" id="from">
    <input type="text" placeholder="To" id="to">
    <input type="date" id="departureDate">
    <button id="searchBtn">Search Flights</button>
</section>

<section class="gallery">
    <img src="{{ url_for('static', filename='images/image1.png') }}" alt="Gallery 1">
    <img src="{{ url_for('static', filename='images/image2.png') }}" alt="Gallery 2">
    <img src="{{ url_for('static', filename='images/images3.png') }}" alt="Gallery 3">
    <img src="{{ url_for('static', filename='images/image4.png') }}" alt="Gallery 4">
    
</section>

<footer>
    <p>© 2025 FlyHigh Airlines. All rights reserved.</p>
    <p>Follow us on:</p>
    <a href="https://www.instagram.com" target="_blank">Instagram</a>
    <a href="https://wa.me" target="_blank">WhatsApp</a>
    <a href="https://www.facebook.com" target="_blank">Facebook</a>
    <a href="https://twitter.com" target="_blank">Twitter</a>
    <a href="https://www.linkedin.com" target="_blank">LinkedIn</a>
</footer>

<!-- Booking Modal -->
<div id="bookingModal" class="modal">
    <div class="modal-content">
        <h2>Book Your Flight</h2>
        <p>Enter your details to complete the booking.</p>
        <input type="text" placeholder="Full Name" id="fullName">
        <input type="email" placeholder="Email" id="email">
        <button id="confirmBooking">Confirm Booking</button>
        <button id="closeModal">Close</button>
    </div>
</div>

<script>
    // Image click interaction
    const galleryImages = document.querySelectorAll('.gallery img');
    galleryImages.forEach(img => {
        img.addEventListener('click', () => {
            alert('You clicked an image!');
        });
    });

    // Modal for booking
    const bookNowBtn = document.getElementById('bookNowBtn');
    const bookingModal = document.getElementById('bookingModal');
    const closeModal = document.getElementById('closeModal');
    const confirmBooking = document.getElementById('confirmBooking');
    
    bookNowBtn.addEventListener('click', () => {
        bookingModal.style.display = 'flex';
    });
    
    closeModal.addEventListener('click', () => {
        bookingModal.style.display = 'none';
    });
    
    confirmBooking.addEventListener('click', () => {
        alert('Booking Confirmed! Check your email for the details.');
        bookingModal.style.display = 'none';
    });

    // Smooth scrolling for page links
    const links = document.querySelectorAll('nav a');
    links.forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelector(this.getAttribute('href')).scrollIntoView({
                behavior: 'smooth'
            });
        });
    });

    // Search Flights Button
    document.getElementById('searchBtn').addEventListener('click', () => {
        const from = document.getElementById('from').value;
        const to = document.getElementById('to').value;
        const date = document.getElementById('departureDate').value;
        alert(`Searching flights from ${from} to ${to} on ${date}`);
    });

    // Dynamic content on page load
    window.addEventListener('load', () => {
        alert("Welcome to FlyHigh Airlines! Book your dream flight today.");
    });
</script>

</body>
</html>
